name: Close Pull Requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const message = `### 🚫 Closed Contribution Policy\n\nThank you for your interest in Vermeil! As stated in our [Contribution Policy](https://github.com/VermeilDev/Vermeil-Launcher/blob/main/CONTRIBUTING.md), this project maintains a **Closed Contribution Policy** and does not accept external pull requests or code contributions.\n\nIf you would like to build custom features or experiment with the code, you are encouraged to [fork the repository](https://github.com/VermeilDev/Vermeil-Launcher/fork) under the terms of the GNU General Public License v3.0 (GPLv3).\n\n*This pull request has been automatically closed.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              state: 'closed',
            });
